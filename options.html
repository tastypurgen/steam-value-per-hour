<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steam Value Per Hour settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="settings-card">
    <h1>Steam Value Per Hour</h1>
    <p class="intro">Choose where the HowLongToBeat and price-history information should come from.</p>

    <form id="settings-form">
      <fieldset>
        <legend>Data mode</legend>
        <label class="mode-option">
          <input type="radio" name="mode" value="standalone" checked>
          <span>
            <strong>Default (Independent) mode (recommended)</strong>
            <small>Uses Steam’s current regional price and a direct HowLongToBeat lookup. It works without other extensions and does not show a record-price column.</small>
          </span>
        </label>
        <label class="mode-option">
          <input type="radio" name="mode" value="advanced">
          <span>
            <strong>Advanced mode</strong>
            <small>Uses direct HowLongToBeat lookup and adds a record-price column using SteamDB's two-year low from the store page.</small>
          </span>
        </label>
      </fieldset>

      <fieldset>
        <legend id="metrics-legend">Displayed metrics</legend>
        <label class="mode-option">
          <input type="checkbox" name="metric" value="All PlayStyles" checked>
          <span>
            <strong id="opt-all-title">All PlayStyles</strong>
            <small id="opt-all-desc">Overall average completion time combining all playstyles.</small>
          </span>
        </label>
        <label class="mode-option">
          <input type="checkbox" name="metric" value="Main Story" checked>
          <span>
            <strong id="opt-main-title">Main Story</strong>
            <small id="opt-main-desc">Time required to complete the main story campaign.</small>
          </span>
        </label>
        <label class="mode-option">
          <input type="checkbox" name="metric" value="Story and Extras" checked>
          <span>
            <strong id="opt-plus-title">Story and Extras</strong>
            <small id="opt-plus-desc">Time for main story plus side quests and extra content.</small>
          </span>
        </label>
        <label class="mode-option">
          <input type="checkbox" name="metric" value="Completionist" checked>
          <span>
            <strong id="opt-100-title">Completionist</strong>
            <small id="opt-100-desc">Time to achieve 100% completion, all achievements, and collectibles.</small>
          </span>
        </label>
      </fieldset>
      <p id="save-status" class="save-status" role="status" aria-live="polite"></p>
    </form>

    <section class="dependencies" aria-labelledby="dependencies-title">
      <h2 id="dependencies-title">Optional extension for Advanced mode</h2>
      <ul>
        <li><a href="https://addons.mozilla.org/en-US/firefox/addon/steam-database/" target="_blank" rel="noopener noreferrer">SteamDB on Firefox Add-ons</a> — enable its Steam price-history block.</li>
      </ul>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
